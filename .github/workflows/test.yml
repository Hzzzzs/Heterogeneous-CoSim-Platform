name: Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install lightweight dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<81"
        pip install numpy scipy matplotlib pybullet gymnasium transforms3d
        pip install -e . --no-deps
    - name: Import chain check
      run: |
        python -c "from hetero_cosim.formations.hetero_ugv import get_dynamics_and_init; from hetero_cosim.runtime import run_demo; from hetero_cosim.ugv_chassis_control import UGVController; from hetero_cosim.unity_bridge import UnityBridge; print('imports OK')"
    - name: Demo smoke test (headless, short, no UDP/obstacles)
      env:
        HETERO_HEADLESS: '1'
        HETERO_UDP: '0'
        HETERO_OBSTACLE_DIR: ''
        HETERO_STEPS: '120'
      run: |
        python -m hetero_cosim.demos.moving
        python -m hetero_cosim.demos.noise_kf
